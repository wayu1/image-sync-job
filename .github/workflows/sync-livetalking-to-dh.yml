name: ACR同步DockerHub-Docker稳定版
on:
  workflow_dispatch
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PWD }}

      - name: 拉取镜像并重命名
        run: |
          SOURCE="crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com/livetalking/livetalking-gpu:v1.0.0"
          TARGET="wayoj007/livetalking-gpu:v1.0.0"
          docker pull "$SOURCE"
          docker tag "$SOURCE" "$TARGET"

      - name: 登录DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}

      - name: 推送镜像至DockerHub
        run: docker push wayoj007/livetalking-gpu:v1.0.0
