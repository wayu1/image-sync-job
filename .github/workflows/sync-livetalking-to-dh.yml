name: ACR同步DockerHub-Skopeo
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ALI_REG: crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com
      ALI_USER: ${{ secrets.ALIYUN_USER }}
      ALI_PWD: ${{ secrets.ALIYUN_PWD }}
      DH_USER: ${{ secrets.DH_USER }}
      DH_PWD: ${{ secrets.DH_PWD }}
    steps:
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt clean
          df -h

      - name: 安装Skopeo
        run: sudo apt update && sudo apt install -y skopeo

      - name: 镜像同步
        run: |
          SOURCE="${{ env.ALI_REG }}/livetalking/livetalking-gpu:v1.0.0"
          TARGET="docker.io/${{ env.DH_USER }}/livetalking-gpu:v1.0.0"
          echo "源镜像: $SOURCE"
          echo "目标镜像: $TARGET"
          
          skopeo copy \
            --retry-times=5 \
            --timeout 600 \
            --remove-signatures \
            --src-creds "${{ env.ALI_USER }}:${{ env.ALI_PWD }}" \
            --dest-creds "${{ env.DH_USER }}:${{ env.DH_PWD }}" \
            docker://"$SOURCE" \
            docker://"$TARGET"
          
          echo "===== 镜像同步完成 ====="
