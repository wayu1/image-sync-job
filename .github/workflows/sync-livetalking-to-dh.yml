name: ACR大镜像流式同步DockerHub(无本地缓存)
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt clean
          df -h

      - name: Install skopeo
        run: sudo apt update && sudo apt install -y skopeo

      - name: Sync image
        env:
          ALI_USER: ${{ secrets.ALIYUN_USER }}
          ALI_PWD: ${{ secrets.ALIYUN_PWD }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PWD: ${{ secrets.DH_PWD }}
        run: |
          SOURCE="crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com/livetalking/livetalking-gpu:v1.0.0"
          TARGET="docker.io/wayoj007/livetalking-gpu:v1.0.0"
          echo "开始同步：$SOURCE ==> $TARGET"
          skopeo copy \
            --retry-times=3 \
            --src-creds "$ALI_USER:$ALI_PWD" \
            --dest-creds "$DH_USER:$DH_PWD" \
            docker://$SOURCE docker://$TARGET
          echo "同步完成"
