name: Build & Push Docker Installer Zip Image to DockerHub
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'Docker Desktop Installer.zip'

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 调试：打印目录文件，确认Dockerfile和zip存在
      - name: List workspace files
        run: ls -la

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录DockerHub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}

      # 构建镜像并推送至docker.io/wayoj007/build-exezip:v0.0.1
      - name: Build and push image
        run: |
          IMAGE_NAME="wayoj007/build-exezip:v0.0.1"
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
