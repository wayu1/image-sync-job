name: Sync ACR Image to DockerHub
on:
  workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录阿里云个人ACR
      - name: Login Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PWD }}

      # 拉取阿里云镜像，重命名为DockerHub地址
      - name: Pull & Retag image
        run: |
          SOURCE_IMG="crpi-a0029cb4opg2q16u.cn-hangzhou.personal.cr.aliyuncs.com/avatar007/exezip:v0.0.1"
          TARGET_IMG="wayoj007/build-exezip:v0.0.1"
          docker pull "$SOURCE_IMG"
          docker tag "$SOURCE_IMG" "$TARGET_IMG"

      # 登录DockerHub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}

      # 推送到DockerHub
      - name: Push to DockerHub
        run: |
          TARGET_IMG="wayoj007/build-exezip:v0.0.1"
          docker push "$TARGET_IMG"
